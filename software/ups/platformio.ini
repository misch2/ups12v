; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
	contrem/arduino-timer@^3.0.1
	arcao/Syslog@^2.0.0
	tzapu/WiFiManager@^2.0.17
	git+https://github.com/misch2/BQ25798_Library@^1.5.0
	knolleary/PubSubClient@^2.8.0
	bblanchon/ArduinoJson@^7.4.2

[env:esp32dev]
board = esp32dev
build_flags = -Iinclude/boards/example

[env:example1]
extends = env:esp32dev
build_flags = -Iinclude/boards/board1
upload_port = board1-test-bq25798-ups1.local

[env:ups1]
extends = env:esp32dev
; build_flags = -DBOARD_CONFIG=ups1_esp18
build_flags = -Iinclude/boards/ups1_esp18
upload_port = esp18-bq25798-ups1.local
; upload_protocol = espota

[env:ups2]
extends = env:esp32dev
build_flags = -Iinclude/boards/ups2_esp27
upload_port = esp27-bq25798-ups2.local

[env:ups3]
extends = env:esp32dev
build_flags = -Iinclude/boards/ups3_esp19
upload_port = esp19-bq25798-ups3.local

[env:ESP32-C3-MINI-1-H4X]
board = esp32-c3-devkitm-1
; 4 MB flash: two 1920 KiB OTA slots, 128 KiB filesystem, NVS and coredump.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_dtr = 0
monitor_rts = 0

[env:ups4]
extends = env:ESP32-C3-MINI-1-H4X
build_flags =
    -Iinclude/boards/v4/ups4_esp76
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool

; First upload: pio run -e ups4 -t upload --upload-port COMx
; Routine OTA upload after WiFi provisioning:
[env:ups4_ota]
extends = env:ups4
upload_protocol = espota
upload_port = esp76-bq25798-ups4.local
