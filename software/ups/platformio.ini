; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	contrem/arduino-timer@^3.0.1
	arcao/Syslog@^2.0.0
	tzapu/WiFiManager@^2.0.17
	git+https://github.com/misch2/BQ25798_Library@^1.4.11
	knolleary/PubSubClient@^2.8.0
	bblanchon/ArduinoJson@^7.4.2
build_flags = -Iinclude/boards/example

[env:example1]
extends = env:esp32dev
build_flags = -Iinclude/boards/board1
upload_port = board1-test-bq25798-ups1.local

[env:ups1]
extends = env:esp32dev
; build_flags = -DBOARD_CONFIG=ups1_esp18
build_flags = -Iinclude/boards/ups1_esp18
upload_port = esp18-bq25798-ups1.local
; upload_protocol = espota

[env:ups2]
extends = env:esp32dev
build_flags = -Iinclude/boards/ups2_esp27
upload_port = esp27-bq25798-ups2.local

[env:ups3]
extends = env:esp32dev
build_flags = -Iinclude/boards/ups3_esp19
upload_port = esp19-bq25798-ups3.local
