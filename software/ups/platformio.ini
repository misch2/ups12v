; Three hardware binaries. Device identity, credentials and operating settings live in NVS.
[platformio]
default_envs = ups_v1_esp32, ups_v3_sys_esp32, ups_v4_esp32c3

[env]
; Pin the platform/core used by the owner's current builds; do not rely on a local platform alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    contrem/arduino-timer@3.0.1
    arcao/Syslog@2.0.1
    https://github.com/misch2/BQ25798_Library.git#00c12a2504bbaa6f8b6f56146b027fec43831c98
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3

; Shared board properties are not additional build environments.
[hw_esp32]
board = esp32dev

[hw_esp32c3]
board = esp32-c3-devkitm-1
; Preserve the installed V4 layout: two 1920 KiB OTA slots within 4 MB.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_dtr = 0
monitor_rts = 0

[env:ups_v1_esp32]
extends = hw_esp32
; Optimize across application/core/library objects for the installed 1280 KiB OTA slots.
build_unflags = -fno-lto
build_flags = -flto -Iinclude/boards/hardware -DUPS_HW_V1

[env:ups_v3_sys_esp32]
extends = hw_esp32
build_unflags = -fno-lto
build_flags = -flto -Iinclude/boards/hardware -DUPS_HW_V3

[env:ups_v4_esp32c3]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/hardware
    -DUPS_HW_V4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
