; Transitional bridge builds. Retained until each installation has saved settings,
; private backup and rollback image; excluded from the normal build.
[platformio]
extra_configs = platformio.ini

[env:ups1]
extends = hw_esp32
build_flags = ${hw_esp32.build_flags} -Iinclude/boards/ups1_esp18
upload_port = esp18-bq25798-ups1.local

[env:ups2]
extends = hw_esp32
build_flags = ${hw_esp32.build_flags} -Iinclude/boards/ups2_esp27
upload_port = esp27-bq25798-ups2.local

[env:ups3]
extends = hw_esp32
build_flags = ${hw_esp32.build_flags} -Iinclude/boards/ups3_esp19
upload_port = esp19-bq25798-ups3.local

[env:ups4]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/v4/ups4_esp76
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = esp76-bq25798-ups4.local

[env:ups5]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/v4/ups5_esp77
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = esp77-bq25798-ups5.local

[env:ups6]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/v4/ups6_esp78
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = esp78-bq25798-ups6.local

[env:ups7]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/v4/ups7_esp79
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = esp79-bq25798-ups7.local

[env:ups8]
extends = hw_esp32c3
build_flags =
    -Iinclude/boards/v4/ups8_esp80
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = esp80-bq25798-ups8.local
